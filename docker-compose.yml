services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # persist data between container restarts

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000 # optional
      - MONGO_URL=mongodb://mongo:27017/bulkUploaderProject # points to MongoDB container
      - JWT_SECRET=secret
      # - BASE_URL=http://localhost:8080
      # - BASE_URL=http://localhost:5000/swagger
    depends_on:
      - mongo

  client:
    build:
      context: ./client/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # environment:
    #   - VITE_API_URL=http://server:5000/api
    # env_file:
    #   - .env # Load .env file for Vite
    depends_on:
      - server

volumes:
  mongo_data:
